name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # ─── CI: Install, Test, Build ───────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if present

      - name: Build project
        run: npm run build --if-present

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/          # change to your build output folder
          retention-days: 1

  # ─── CD: Deploy to VPS via SSH ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}           # defaults to 22 if not set
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            set -e

            echo "→ Pulling latest code..."
            cd /var/www/your-app                  # change to your app directory
            git pull origin main

            echo "→ Installing dependencies..."
            npm ci --omit=dev

            echo "→ Building..."
            npm run build --if-present

            echo "→ Restarting app..."
            pm2 restart your-app-name             # or: systemctl restart your-app
            # pm2 save                            # uncomment to persist PM2 process list

            echo "✓ Deployment complete"
